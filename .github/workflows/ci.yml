name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Pin a deployment target below the runner's own OS version so a library
      # API introduced in a very recent SDK cannot silently become a build
      # requirement. std::from_chars for floating point is macOS 26 only, and
      # the runner defaulting to its own version is what hid that. CMake
      # initializes CMAKE_OSX_DEPLOYMENT_TARGET from this and clang reads it
      # directly; Linux runners ignore it.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install numpy
      - name: Test benchmark tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
